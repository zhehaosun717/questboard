[package]
name = "questboard-desktop"
version = "0.1.0"
description = "questboard desktop shell: starts the local board server and opens it in a native window"
edition = "2021"
license = "MIT"

[lib]
name = "questboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
